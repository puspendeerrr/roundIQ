version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: roundiq-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword2026
      POSTGRES_DB: roundiq
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roundiq-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roundiq-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://postgres:adminpassword2026@postgres:5432/roundiq?schema=public'
      REDIS_URL: 'redis://redis:6379'
      JWT_ACCESS_SECRET: 'roundiq_jwt_access_secret_key_2026_super_secure_98765'
      JWT_REFRESH_SECRET: 'roundiq_jwt_refresh_secret_key_2026_super_secure_12345'
      FRONTEND_URL: 'http://localhost'
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roundiq-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: 'http://localhost/api/v1'
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: roundiq-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
